name: Collector GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - "Collector/**"
      - ".github/workflows/collector-ghcr.yml"
    tags:
      - "collector-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: Collector/go.mod

      - name: Test and format-check
        working-directory: Collector
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/wrf-platform-probe.exe" ./cmd/wrf-platform-probe

      - name: Build and sign Deck agent
        env:
          SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY_PEM_B64 }}
        working-directory: Collector
        run: |
          test -n "$SIGNING_KEY"
          mkdir -p dist
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/agent-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/agent-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/agent-signing-key.pem" -pubout -out "$RUNNER_TEMP/agent-public-key.pem"
          cmp -s "$RUNNER_TEMP/agent-public-key.pem" update-public-key.pem
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            agent_version="${GITHUB_REF_NAME#collector-v}"
          else
            agent_version="sha-${GITHUB_SHA::12}"
          fi
          [[ "$agent_version" =~ ^[A-Za-z0-9._+-]{1,64}$ ]]
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/wrf-platform-probe.exe ./cmd/wrf-platform-probe
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags platformprobe -trimpath -ldflags "-s -w -X main.version=$agent_version" -o dist/wrf-collector .
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/agent-signing-key.pem" -rawin -in dist/wrf-collector -out "$RUNNER_TEMP/wrf-collector.sig"
          agent_sha="$(sha256sum dist/wrf-collector | awk '{print $1}')"
          agent_signature="$(base64 -w0 "$RUNNER_TEMP/wrf-collector.sig")"
          printf '{"version":"%s","sha256":"%s","signature":"%s"}\n' "$agent_version" "$agent_sha" "$agent_signature" > dist/agent-manifest.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/owendb1/wrf-compat-tools-collector
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
            type=sha
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: Collector
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
